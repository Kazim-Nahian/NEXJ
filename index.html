<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Jhikargacha - Control Dashboard</title>
    <!-- Stable Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; }
        .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">

    <!-- Auth Screen (লগইন এবং সাইন-আপ) -->
    <div id="auth-screen" class="flex flex-col items-center justify-center min-h-screen p-4">
        <div class="w-full max-w-md p-8 rounded-2xl glass-card shadow-2xl">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
                    Nexus Jhikargacha
                </h1>
                <p class="text-gray-400 mt-2 text-sm">আপনার ক্লাউড ডাটাবেজ ড্যাশবোর্ডে প্রবেশ করুন</p>
            </div>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">ইমেইল অ্যাড্রেস</label>
                    <input id="auth-email" type="email" placeholder="example@knweb.com" class="w-full px-4 py-3 bg-gray-900 border border-gray-800 rounded-xl focus:outline-none focus:border-cyan-500 text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">পাসওয়ার্ড</label>
                    <input id="auth-password" type="password" placeholder="••••••••" class="w-full px-4 py-3 bg-gray-900 border border-gray-800 rounded-xl focus:outline-none focus:border-cyan-500 text-white">
                </div>

                <div class="grid grid-cols-2 gap-4 mt-6">
                    <button type="button" onclick="loginUser()" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold rounded-xl shadow-lg transition-all cursor-pointer">
                        লগইন করুন
                    </button>
                    <button type="button" onclick="registerUser()" class="w-full py-3 bg-gray-800 text-gray-200 font-bold rounded-xl transition-all cursor-pointer">
                        সাইন-আপ (নতুন)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Dashboard Screen (লগইন সফল হলে এটি দেখাবে) -->
    <div id="dashboard-screen" class="hidden max-w-6xl mx-auto px-4 py-8">
        <header class="flex flex-col md:flex-row md:items-center md:justify-between p-6 mb-8 rounded-2xl glass-card">
            <div>
                <h2 class="text-2xl font-bold text-white">কন্ট্রোল প্যানেল</h2>
                <p id="user-display-email" class="text-sm text-cyan-400 mt-1">ইউজার: loading...</p>
            </div>
            <div class="flex items-center gap-4 mt-4 md:mt-0">
                <div class="px-5 py-2.5 bg-cyan-950/50 border border-cyan-800/50 rounded-xl text-center">
                    <span class="block text-xs text-cyan-400 uppercase tracking-widest font-semibold">ইকো ব্যালেন্স</span>
                    <span id="credit-balance" class="text-xl font-black text-white">00</span> <span class="text-xs text-gray-400">Points</span>
                </div>
                <button type="button" onclick="logoutUser()" class="px-4 py-2.5 bg-red-950/40 text-red-400 text-sm font-medium rounded-xl border border-red-900/50 cursor-pointer">
                    লগআউট
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Eco Rewards -->
            <div class="p-6 rounded-2xl glass-card flex flex-col justify-between">
                <div>
                    <h3 class="text-lg font-bold text-white mb-2">🌱 Eco-Rewards Grid</h3>
                    <p class="text-sm text-gray-400 mb-6">পরিবেশবান্ধব কাজের জন্য পয়েন্ট ক্লেইম করুন।</p>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <button type="button" onclick="updateCredits(100)" class="py-3 bg-emerald-950/50 text-emerald-400 border border-emerald-800/50 font-semibold rounded-xl cursor-pointer">
                        +১০০ পয়েন্ট নিন
                    </button>
                    <button type="button" onclick="updateCredits(500)" class="py-3 bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold rounded-xl cursor-pointer">
                        +৫০০ মেগা বোনাস
                    </button>
                </div>
            </div>

            <!-- Voice of Justice -->
            <div class="p-6 rounded-2xl glass-card">
                <h3 class="text-lg font-bold text-white mb-2">⚖️ Voice of Justice</h3>
                <p class="text-sm text-gray-400 mb-4">আপনার অভিযোগটি ক্লাউড ডাটাবেজে সাবমিট করুন।</p>
                <div class="space-y-3">
                    <textarea id="report-input" rows="3" placeholder="এখানে বিস্তারিত লিখুন..." class="w-full px-4 py-3 bg-gray-900 border border-gray-800 rounded-xl text-white text-sm resize-none focus:outline-none focus:border-purple-500"></textarea>
                    <button type="button" onclick="submitJusticeReport()" class="w-full py-3 bg-purple-600 text-white font-bold rounded-xl cursor-pointer">
                        সাবমিট করুন
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logics (ডুপ্লিকেট কোড পুরোপুরি রিমুভড) -->
    <script>
        const SUPABASE_URL = 'https://vjzdudfpnqrzpwcjgzse.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_1bSYCeODzqSaJy7FmUceAw_jp-ENZ3n';
        
        // সুপাবেস ক্লায়েন্ট (পুরো ফাইলে এটি শুধুমাত্র একবারই ডিক্লেয়ার করা হয়েছে)
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function checkUserSession() {
            supabase.auth.getSession().then(({ data: { session } }) => {
                if (session && session.user) {
                    document.getElementById('auth-screen').classList.add('hidden');
                    document.getElementById('dashboard-screen').classList.remove('hidden');
                    document.getElementById('user-display-email').innerText = `ইউজার: ${session.user.email}`;
                    fetchUserCredits(session.user.id);
                } else {
                    document.getElementById('auth-screen').classList.remove('hidden');
                    document.getElementById('dashboard-screen').classList.add('hidden');
                }
            }).catch(err => console.error("Session Check Error:", err));
        }

        window.onload = checkUserSession;

        async function registerUser() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            if(!email || !password) { alert("ইউজার ইমেইল ও পাসওয়ার্ড দিন!"); return; }

            const { data, error } = await supabase.auth.signUp({ email, password });

            if (error) {
                alert("এরর: " + error.message);
                return;
            }

            if (data.user) {
                await supabase.from('user_profiles').insert([{ id: data.user.id, credits: 5000 }]);
                alert("অ্যাকাউন্ট সফলভাবে তৈরি হয়েছে! এবার লগইন করুন।");
            }
        }

        async function loginUser() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            if(!email || !password) { alert("ইমেইল ও পাসওয়ার্ড দিন!"); return; }

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                alert("লগইন ব্যর্থ: " + error.message);
                return;
            }

            alert("লগইন সফল হয়েছে!");
            checkUserSession();
        }

        async function logoutUser() {
            await supabase.auth.signOut();
            alert("লগআউট হয়েছে!");
            checkUserSession();
        }

        async function fetchUserCredits(userId) {
            const { data, error } = await supabase.from('user_profiles').select('credits').eq('id', userId).maybeSingle();
            if (data) {
                document.getElementById('credit-balance').innerText = data.credits;
            }
        }

        async function updateCredits(amount) {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) return;

            const userId = session.user.id;
            const { data: profile } = await supabase.from('user_profiles').select('credits').eq('id', userId).maybeSingle();

            let currentCredits = profile ? profile.credits : 0;
            const newCredits = currentCredits + amount;

            const { error } = await supabase.from('user_profiles').update({ credits: newCredits }).eq('id', userId);

            if (error) { alert("আপডেট ব্যর্থ: " + error.message); } 
            else { alert(`+${amount} পয়েন্ট যোগ হয়েছে!`); fetchUserCredits(userId); }
        }

        async function submitJusticeReport() {
            const reportText = document.getElementById('report-input').value;
            if (!reportText.trim()) { alert("বক্স খালি!"); return; }

            const { error } = await supabase.from('justice_ledger').insert([{ report: reportText }]);

            if (error) { alert("সাবমিট ব্যর্থ: " + error.message); } 
            else { alert("রিপোর্ট ক্লাউডে সেভ হয়েছে!"); document.getElementById('report-input').value = ''; }
        }
    </script>
</body>
</html>
